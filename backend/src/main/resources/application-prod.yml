spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:shopsphere_db}}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=false&serverTimezone=UTC
    username: ${DB_USERNAME:${MYSQLUSER:}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
