spring:
  datasource:
    url: jdbc:h2:mem:shopsphere_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: test-only-jwt-signing-key-not-for-real-environments
  cookie:
    secure: false
  seed:
    admin-email: admin@shopsphere.local
    admin-password: Admin@12345
    sample-data: false
  payment:
    simulation-enabled: true
