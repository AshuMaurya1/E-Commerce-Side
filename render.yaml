services:
  - type: web
    name: shopsphere-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: FRONTEND_URL
        value: https://shopsphere-three-plum.vercel.app
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: None
      - key: APP_PAYMENT_SIMULATION_ENABLED
        value: true
      - key: APP_SEED_SAMPLE_DATA
        value: true
      - key: APP_SEED_ADMIN_EMAIL
        value: admin@shopsphere.local
      - key: APP_SEED_ADMIN_PASSWORD
        value: Admin@12345
      - key: JWT_SECRET
        generateValue: true
